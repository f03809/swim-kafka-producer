apiVersion: apps/v1
kind: Deployment
metadata:
  name: swim-producer-tfms
  namespace: swim
  labels:
    app: swim-producer
    service: tfms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swim-producer
      service: tfms
  template:
    metadata:
      labels:
        app: swim-producer
        service: tfms
    spec:
      containers:
        - name: producer
          image: swim-kafka-producer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: swim-kafka
            - secretRef:
                name: swim-secrets
          env:
            - name: SWIM_SUBSCRIPTIONS
              valueFrom:
                configMapKeyRef:
                  name: swim-subscriptions
                  key: tfms
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
